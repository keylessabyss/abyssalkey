<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>Morninghollow: Dayfall</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #080b12; color: #e8f3ff; }
    #game { position: relative; }
    #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #gameStatus {
      position: absolute; left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 7px 10px; border: 1px solid #31566c; border-radius: 6px;
      background: rgb(8 16 24 / 78%); color: #d8efff; font-size: 13px;
      pointer-events: none;
    }
    #gameError {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding: 24px; background: #080b12; text-align: center;
    }
    #gameError[hidden] { display: none; }
    #gameError section { max-width: 560px; }
    #gameError h1 { font-size: clamp(22px, 5vw, 36px); }
    #gameError p { color: #c4d0dc; line-height: 1.55; overflow-wrap: anywhere; }
  </style>
  <script type="module" crossorigin src="../assets/game-B1GOiNrv.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/BundledSampleProjectLoader-CgF0Cnc7.js">
</head>
<body>
  <main id="game" aria-label="Morninghollow: Dayfall game viewport">
    <canvas id="gameViewport" aria-label="3D game scene"></canvas>
    <div id="gameStatus" role="status">Loading Dayfall…</div>
    <div id="gameError" role="alert" hidden>
      <section>
        <h1 id="gameErrorTitle">The game could not start</h1>
        <p id="gameErrorMessage"></p>
      </section>
    </div>
  </main>
</body>
</html>
