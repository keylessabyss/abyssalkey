<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>Morninghollow: Dayfall</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; background: #080b12; }
    body { display: grid; place-items: center; color: #d8efff; }
  </style>
</head>
<body>
  <main role="status">Launching Morninghollow: Dayfall…</main>
  <script>
    const gameUrl = new URL("../", window.location.href);
    gameUrl.search = window.location.search;
    gameUrl.searchParams.set("standaloneDayfall", "1");
    window.location.replace(gameUrl.href);
  </script>
</body>
</html>
