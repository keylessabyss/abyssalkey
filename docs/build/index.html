<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>Abyssal Engine Editor</title>
    <style></style>
  <script type="module" crossorigin src="./assets/index-Bsesn3en.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Qq_Y9E1b.css">
</head>

<body>
    <div id="editor">

        <div id="toolbar">
            <strong>Abyssal Engine</strong>
            <div id="mainMenu"></div>
            <div id="editorPanelToggles" aria-label="Editor panels">
                <button type="button" data-editor-panel-toggle="hierarchy" aria-expanded="false">
                    Hierarchy
                </button>
                <button type="button" data-editor-panel-toggle="details" aria-expanded="false">
                    Details
                </button>
                <button type="button" data-editor-panel-toggle="content" aria-expanded="false">
                    Content
                </button>
            </div>
            <a id="docsButton" href="./docs/index.html">Docs</a>
            <div id="projectStatus">No Project</div>
        </div>

        <div id="leftPanel"><h3>Hierarchy</h3><div id="hierarchyList"></div></div>

        <div
            id="leftPanelSplitter"
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize Hierarchy"
            tabindex="0"
        ></div>

        <div id="leftDevicePanel"></div>

        <div id="viewportContainer">
            <canvas id="viewport"></canvas>
            <div id="uiEditorStageHost" class="ui-editor-stage-host" hidden></div>
        </div>

        <div
            id="rightPanelSplitter"
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize Details"
            tabindex="0"
        ></div>

        <div id="rightDevicePanel"></div>

        <div id="rightPanel"></div>

        <div
            id="bottomPanelSplitter"
            role="separator"
            aria-orientation="horizontal"
            aria-label="Resize Content Browser"
            tabindex="0"
        ></div>

        <div id="bottomPanel"></div>

    </div>

</body>

</html>
