<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="refresh" content="0; url=/abyssalkey/build/index.html">
<title>Abyssal Engine Editor</title>

</head>

<body>
<div id="editor">

    <div id="toolbar">
        <strong>Abyssal Engine</strong>
        <div style="margin-left:20px;">File | Edit | View | Build | Play</div>

    <div id="leftPanel"></div>

<script type="module" src="./dist/main.js"></script>
